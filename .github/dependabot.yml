version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version, or the job fails
      codeql-action:
        patterns:
          - "github/codeql-action/*"
